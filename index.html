        // =================================================================

        document.getElementById('tituloPrincipal').innerText = tituloWeb;
        let typingInterval = null;

        function cambiarFondo(url) {
            if(url && url.trim() !== "") {
                document.body.style.backgroundImage = `url('${url}')`;
                document.body.style.backgroundSize = "cover";
            }
        }

        function renderizarCartas() {
            const contenedor = document.getElementById('contenedorCartas');
            contenedor.innerHTML = '';
            misCartas.forEach((carta, index) => {
                const card = document.createElement('div');
                card.className = 'sobre-card';
                
                if(carta.img && carta.img.trim() !== "") {
                    card.style.backgroundImage = `url('${carta.img}')`;
                } else {
                    card.style.backgroundColor = 'rgba(255, 255, 255, 0.08)';
                }

                card.innerHTML = `
                    <div class="sobre-view" onclick="iniciarRevelacion(${index})">
                        <div class="sobre-content-overlay"><div class="sobre-titulo">${carta.titulo}</div></div>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function iniciarRevelacion(index) {
            const carta = misCartas[index];
            const escenario = document.getElementById('escenarioRevelacion');
            const imgElement = document.getElementById('revelarImagen');
            const vidElement = document.getElementById('revelarVideo');
            const frameContenedor = document.getElementById('revelarFrameContenedor');
            const frameElement = document.getElementById('revelarFrame');
            const textoElement = document.getElementById('textoEfectoMaquina');
            const btnCerrar = document.getElementById('btnCerrarRev');

            document.body.classList.add('revelacion-activa');
            escenario.classList.add('mostrar');
            escenario.scrollTop = 0;
            textoElement.textContent = "";
            btnCerrar.classList.remove('mostrar');
            clearInterval(typingInterval);

            // Reset multimedia
            imgElement.style.display = "none";
            imgElement.classList.remove('animar');
            vidElement.style.display = "none";
            vidElement.classList.remove('animar');
            vidElement.pause();
            vidElement.src = "";
            frameContenedor.style.display = "none";
            frameContenedor.classList.remove('animar');
            frameElement.src = "";

            // Lógica inteligente de detección de contenidos
            const urlMultimedia = carta.videoUrl || carta.img;
            const esVideoMp4 = urlMultimedia && urlMultimedia.toLowerCase().endsWith('.mp4');
            const esVideoEmbed = urlMultimedia && (urlMultimedia.includes('youtube.com') || urlMultimedia.includes('drive.google.com'));
            const esSoloVideo = (esVideoMp4 || esVideoEmbed) && (!carta.texto || carta.texto.trim() === "");

            if (esVideoMp4) {
                vidElement.src = urlMultimedia;
                vidElement.style.display = "block";
                setTimeout(() => vidElement.classList.add('animar'), 100);
                vidElement.play().catch(e => console.log("Play prevenido"));
            } else if (esVideoEmbed) {
                let urlFinal = urlMultimedia;
                if(urlFinal.includes('youtube.com')) {
                    urlFinal += urlFinal.includes('?') ? '&autoplay=1' : '?autoplay=1';
                }
                frameElement.src = urlFinal;
                frameContenedor.style.display = "block";
                setTimeout(() => frameContenedor.classList.add('animar'), 100);
            } else if (carta.img && carta.img.trim() !== "") {
                imgElement.src = carta.img;
                imgElement.style.display = "block";
                setTimeout(() => imgElement.classList.add('animar'), 100);
            }

            if (esSoloVideo) {
                textoElement.style.display = "none";
                btnCerrar.classList.add('mostrar');
            } else {
                textoElement.style.display = "block";
                let i = 0;
                const mensaje = carta.texto || "";
                
                setTimeout(() => {
                    typingInterval = setInterval(() => {
                        if (i < mensaje.length) {
                            textoElement.textContent += mensaje.charAt(i);
                            i++;
                            if(escenario.scrollHeight > escenario.clientHeight) {
                                escenario.scrollTop = escenario.scrollHeight;
                            }
                        } else {
                            clearInterval(typingInterval);
                            btnCerrar.classList.add('mostrar');
                        }
                    }, 15);
                }, 800);
            }
        }

        function cerrarRevelacion() {
            clearInterval(typingInterval);
            document.getElementById('revelarVideo').pause();
            document.getElementById('revelarFrame').src = "";
            document.body.classList.remove('revelacion-activa');
            document.getElementById('escenarioRevelacion').classList.remove('mostrar');
            document.getElementById('revelarImagen').classList.remove('animar');
            document.getElementById('revelarVideo').classList.remove('animar');
            document.getElementById('revelarFrameContenedor').classList.remove('animar');
            document.getElementById('textoEfectoMaquina').textContent = "";
        }

        // Contador de Tiempo
        setInterval(() => {
            const now = new Date();
            let diff = now - startDate;
            if (diff < 0) { document.getElementById('contador').innerHTML = "Cargando..."; return; }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('contador').innerHTML = `Juntos desde hace: ${d}d ${h}h ${m}m ${s}s`;
        }, 1000);

        // Lluvia de corazones blanca
        setInterval(() => {
            if(document.body.classList.contains('revelacion-activa')) return;
            const heart = document.createElement('div');
            heart.classList.add('heart-bg'); heart.innerHTML = '🤍';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }, 600);

        cambiarFondo(fondoWeb);
        renderizarCartas();
    </script>
